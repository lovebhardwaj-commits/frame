<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Templates Studio — design Meta image templates for catalog ads</title>
<meta name="description" content="Design Meta image templates for catalog ads: product, catalog field, text, shape and image layers in 1:1, 4:5 and 9:16, with a ready-to-rebuild kit for Commerce Manager.">
<meta name="theme-color" content="#faf5f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow:ital,wght@0,400;0,700;1,400;1,700&family=Barlow+Condensed:wght@400;700&family=Bebas+Neue&family=Cabin:ital,wght@0,400;0,700;1,400;1,700&family=Comfortaa:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Fira+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;1,400;1,700&family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,400;0,700;1,400;1,700&family=Quicksand:wght@400;700&family=Raleway:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Work+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
:root{--bg:#faf5f1;--pn:#ffffff;--cd:#f6f6f6;--cd2:#eeeeef;--bd:#e8e3e0;--bdh:#dededf;--tx:#16151e;--tx2:#5c5c6a;--tx3:#6f6f7d;--ac:#bf402d;--ac2:#de8274;--acb:#f9eae8;--acbd:#f2cfc9;--ok:#3c7c49;--okb:#e8f3ea;--wn:#9a5b00;--wnb:#fff4dc;--grad:linear-gradient(90deg,#de8375,#e7a991 50%,#de8475)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,sans-serif;font-size:13px;color:var(--tx);background:var(--bg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.top{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-size:14px}
.brand b{font-weight:800;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:9px;background:var(--grad);position:relative;flex:0 0 32px}
.logo:before{content:"";position:absolute;inset:8px;border:2px solid #fff;border-radius:4px}
.logo:after{content:"";position:absolute;left:12px;top:12px;width:8px;height:8px;background:#fff;border-radius:2px}
nav{display:flex;gap:2px;margin-left:10px}
.nb{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--tx2)}
.nb:hover{background:var(--cd2);color:var(--tx)}
.nb.on{background:var(--acb);color:var(--ac)}
.sp{flex:1}
#edTools{display:flex;align-items:center;gap:8px}
.btn{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--bdh);background:var(--pn);font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--acbd);background:var(--acb)}
.btn.p{background:var(--grad);border-color:transparent;color:#fff}
.btn.p:hover{filter:brightness(.97);background:var(--grad)}
.btn.s{height:28px;padding:0 10px;font-size:12px;font-weight:600}
.btn.w{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--bdh);background:var(--pn);font-size:16px;line-height:1}
.ib:hover{background:var(--acb);border-color:var(--acbd)}
.ib.s{width:26px;height:26px;border-radius:7px;font-size:13px;border-color:transparent;background:none;color:var(--tx2)}
.ib.s:hover{background:var(--cd2);color:var(--tx)}
.namechip{height:34px;max-width:300px;padding:0 12px;border-radius:9px;border:1px solid var(--bdh);background:var(--pn);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namechip:hover{border-color:var(--acbd);background:var(--acb)}
.namechip span{color:var(--tx3);font-weight:600}
.view{flex:1;min-height:0;overflow:auto}
.wrap{max-width:1180px;margin:0 auto;padding:36px 24px 60px}
.kick{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
h1{font-family:'Playfair Display',serif;font-size:44px;line-height:1.08;margin:10px 0 12px;letter-spacing:-.01em}
h1 em{color:var(--ac);font-style:italic}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.lead{font-size:15px;line-height:1.55;color:var(--tx2);max-width:680px;margin:0 0 24px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 34px}
.card{background:var(--pn);border:1px solid var(--bdh);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
button.card:hover{border-color:var(--acbd);background:#fffdfc}
.card b{font-size:14px}
.card span{color:var(--tx2);line-height:1.45}
.card .ci{width:36px;height:36px;border-radius:10px;background:var(--acb);color:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;margin-bottom:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.chip{height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--bdh);background:var(--pn);font-weight:600;color:var(--tx2)}
.chip:hover{border-color:var(--acbd)}
.chip.on{background:var(--acb);border-color:var(--acbd);color:var(--ac)}
.inp,.sel,textarea.inp{width:100%;height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--bdh);background:var(--pn)}
textarea.inp{height:auto;min-height:64px;padding:8px 10px;resize:vertical;line-height:1.4}
.inp:focus,.sel:focus{border-color:var(--ac2);outline:0;box-shadow:0 0 0 3px var(--acb)}
.srch{max-width:320px;border-radius:99px;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tc{background:var(--pn);border:1px solid var(--bdh);border-radius:14px;overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column}
.tc:hover{border-color:var(--acbd);box-shadow:0 8px 24px rgba(22,21,30,.08)}
.tc canvas{width:100%;height:auto;display:block;background:var(--cd)}
.tc .cap{padding:9px 11px;border-top:1px solid var(--bd)}
.tc .cap b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .cap span{font-size:11px;color:var(--tx3)}
.tc .del{position:absolute;right:8px;top:8px}
.empty{padding:50px 20px;text-align:center;color:var(--tx2);border:1px dashed var(--bdh);border-radius:14px;background:var(--pn)}
.ed{display:grid;grid-template-columns:272px 300px minmax(0,1fr);overflow:hidden}
#pL,#pM{background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:16px}
#pR{display:flex;flex-direction:column;min-width:0;min-height:0;background:#f3f1ee}
.ph b{display:block;font-size:15px}
.ph span{color:var(--tx2);line-height:1.4;display:block;margin-top:2px}
.lbl{font-size:11px;font-weight:700;color:var(--tx2);margin:14px 0 6px}
.psec{font-size:13px;font-weight:800;margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--bd)}
.psec:first-child{border-top:0;padding-top:0;margin-top:0}
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:11.5px;font-weight:600;color:var(--tx2);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:11.5px;line-height:1.45;color:var(--tx2);margin:4px 0 10px}
.note{font-size:11.5px;line-height:1.45;padding:8px 10px;border-radius:9px;background:var(--wnb);color:var(--wn);margin:6px 0 10px}
.note.ok{background:var(--okb);color:var(--ok)}
.note.er{background:#fdecea;color:#a3271a}
.seg{display:flex;background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;height:28px;border:0;border-radius:7px;background:none;font-weight:700;color:var(--tx2)}
.seg button.on{background:var(--pn);color:var(--tx);box-shadow:inset 0 0 0 1px var(--bdh)}
.col{display:flex;gap:8px;align-items:center}
.col input[type=color]{width:36px;height:34px;padding:2px;border:1px solid var(--bdh);border-radius:9px;background:var(--pn);flex:0 0 36px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sw b{display:block;font-weight:600}
.sw span{display:block;font-size:11.5px;color:var(--tx2)}
.tg{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--cd2);border:1px solid var(--bdh);position:relative;flex:0 0 38px;cursor:pointer;margin:0}
.tg:before{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.tg:checked{background:var(--ac2);border-color:var(--ac2)}
.tg:checked:before{left:18px}
.lay{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;border:1px solid transparent;margin-bottom:4px;cursor:pointer}
.lay:hover{background:var(--cd)}
.lay.on{background:var(--acb);border-color:var(--acbd)}
.lay .th{width:32px;height:32px;border-radius:7px;background:var(--cd2);flex:0 0 32px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--tx2);overflow:hidden}
.lay .nm{flex:1;min-width:0}
.lay .nm b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lay .nm span{font-size:10.5px;color:var(--tx3)}
.lay.hid .nm{opacity:.45}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 5px;border-radius:5px;background:var(--okb);color:var(--ok)}
.tag.im{background:var(--wnb);color:var(--wn)}
.menu{position:fixed;z-index:60;min-width:200px;max-height:70vh;overflow:auto;background:var(--pn);border:1px solid var(--bdh);border-radius:12px;box-shadow:0 12px 32px rgba(22,21,30,.14);padding:6px}
.menu button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left;font-weight:600}
.menu button:hover{background:var(--acb);color:var(--ac)}
.menu .mh{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);padding:8px 10px 4px}
.tabs{display:flex;gap:4px;padding:10px 14px 0;background:var(--pn);border-bottom:1px solid var(--bd)}
.tab{border:0;background:none;padding:9px 12px;font-weight:700;color:var(--tx2);border-bottom:2px solid transparent}
.tab.on{color:var(--ac);border-bottom-color:var(--ac2)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#cvWrap{box-shadow:0 8px 28px rgba(22,21,30,.12);background:#fff;line-height:0}
#cv{display:block;touch-action:none}
#gridView,#metaView{flex:1;min-height:0;overflow:auto;padding:18px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pg .pc{background:var(--pn);border:1px solid var(--bdh);border-radius:10px;overflow:hidden;padding:0;text-align:left}
.pg .pc.on{border-color:var(--ac2);box-shadow:0 0 0 2px var(--acb)}
.pg canvas{width:100%;height:auto;display:block}
.pg .cap{padding:6px 8px;font-size:11px;border-top:1px solid var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg .fl{color:var(--wn);font-weight:700}
#pbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:10px 14px;background:var(--pn);border-top:1px solid var(--bd)}
#pbar .fld{margin:0;min-width:150px}
#pbar .grow{flex:1;min-width:200px}
.wchip{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--bdh);background:var(--okb);color:var(--ok);font-weight:700}
.wchip.w{background:var(--wnb);color:var(--wn);border-color:#f0d9a8}
.step{background:var(--pn);border:1px solid var(--bdh);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.step h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:8px}
.step h4 i{width:22px;height:22px;border-radius:50%;background:var(--acb);color:var(--ac);font-style:normal;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px}
.kv{display:grid;grid-template-columns:130px 1fr auto;gap:4px 10px;align-items:center;font-size:12px}
.kv span{color:var(--tx2)}
.kv code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--cd);padding:3px 7px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{border:0;background:none;color:var(--ac);font-weight:700;font-size:11px;padding:2px 4px}
#modal{position:fixed;inset:0;z-index:80;background:rgba(22,21,30,.4);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--pn);border-radius:16px;width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg.sm{width:min(420px,100%)}
.dlg header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--bd)}
.dlg header b{font-size:15px}
.dlg .bd{padding:16px 18px;overflow:auto}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--bd)}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-bottom:6px}
.pk button{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pk button:hover{border-color:var(--acbd);background:var(--acb)}
.pk canvas{width:52px;height:52px}
.pk.big{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.pk.big canvas{width:112px;height:64px}
.pk span{font-size:10px;color:var(--tx2);text-align:center;line-height:1.2}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#16151e;color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88vw}
.toast.er{background:#a3271a}
@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}.ed{grid-template-columns:1fr;overflow:auto}#pL,#pM{border-right:0;border-bottom:1px solid var(--bd);overflow:visible}#pR{order:-1;min-height:70vh}h1{font-size:32px}nav{display:none}}
</style>
</head>
<body>
<header class="top">
<button class="brand" id="bHome" title="Home"><span class="logo"></span><b>Image Templates Studio</b></button>
<nav><button class="nb" data-v="home">Home</button><button class="nb" data-v="gal">Templates</button><button class="nb" data-v="mine">My templates</button></nav>
<div class="sp"></div>
<div id="edTools" hidden>
<button class="namechip" id="bName" title="Rename this template"></button>
<button class="ib" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
<button class="ib" id="bRedo" title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
<button class="btn" id="bSave">Save</button>
<button class="btn p" id="bExport">Export for Meta</button>
</div>
<button class="btn" id="bBrand">Brand kit</button>
</header>
<main id="vHome" class="view"></main>
<main id="vGal" class="view" hidden></main>
<main id="vEd" class="view ed" hidden>
<aside id="pL" aria-label="Layers"></aside>
<aside id="pM" aria-label="Layer properties"></aside>
<section id="pR">
<div class="tabs" id="tabs"></div>
<div id="stage"><div id="cvWrap"><canvas id="cv"></canvas></div></div>
<div id="gridView" hidden></div>
<div id="metaView" hidden></div>
<div id="pbar"></div>
</section>
</main>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>
<input type="file" id="fImg" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="fCsv" accept=".csv,text/csv" hidden>
<script src="js/core.js?v=1"></script>
<script src="js/shapes.js?v=1"></script>
<script src="js/stickers.js?v=1"></script>
<script src="js/render.js?v=1"></script>
<script src="js/catalog.js?v=1"></script>
<script src="js/templates.js?v=1"></script>
<script src="js/export.js?v=1"></script>
<script src="js/editor.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
